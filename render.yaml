# Blueprint Render : application Next.js + base PostgreSQL gérée.
# Render → New → Blueprint → sélectionner ce dépôt. Renseigner ensuite les variables
# marquées « sync: false » (APP_URL, SMTP, Cloudflare R2…).
services:
  - type: web
    name: jp-services
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Les migrations sont idempotentes : elles s'appliquent à chaque démarrage, avant le serveur.
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: jp-services-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Lubumbashi
      # Fichiers téléversés : Cloudflare R2 (le disque Render est effacé à chaque déploiement)
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: jp-services-uploads
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # E-mails transactionnels
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: SMTP_FROM_NAME
        value: JP-Services
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: jp-services-db
    databaseName: jpservices
    user: jp
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
