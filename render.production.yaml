# JP-Services — production officielle (gérée séparément de la prévisualisation).
# Plan de déploiement uniquement : ne pas synchroniser avant validation du budget,
# de la messagerie, des clés R2 et des DNS Cloudflare.
services:
  - type: web
    name: jp-services-production
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: ccr-598b649d-2fiktj
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    domains:
      - jp-services.org
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: APP_URL
        value: https://jp-services.org
      - key: APP_TIMEZONE
        value: Africa/Lubumbashi
      - key: JP_PREVIEW_MODE
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jp-services-production-db
          property: connectionString
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: jp-services-uploads
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        value: contact@jp-services.org
      - key: SMTP_FROM_NAME
        value: JP-Services
      - key: ADMIN_NOTIFICATION_EMAIL
        value: contact@jp-services.org
databases:
  - name: jp-services-production-db
    databaseName: jpservices_prod
    user: jpservices_prod
    postgresMajorVersion: "16"
    region: frankfurt
    plan: 0.1c-256mb
    ipAllowList: []
