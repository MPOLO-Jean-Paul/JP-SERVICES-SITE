# Déploiement autonome sur un VPS : PostgreSQL + application + migrations.
#   cp .env.example .env   (renseigner APP_URL, APP_SECRET, SMTP, DB_PASSWORD…)
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jpservices
      POSTGRES_USER: jp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jp -d jpservices"]
      interval: 5s
      retries: 30

  # Étape « build » de l’image : contient les sources et outils (tsx, drizzle) pour migrer puis initialiser.
  migrate:
    build: { context: ., target: build }
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://jp:${DB_PASSWORD}@db:5432/jpservices
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    env_file: .env
    environment:
      DATABASE_URL: postgres://jp:${DB_PASSWORD}@db:5432/jpservices
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
    ports: ["3000:3000"]
    volumes: ["uploads:/app/uploads"]

volumes:
  pg-data:
  uploads:
