name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: jpservices
          MYSQL_USER: jp
          MYSQL_PASSWORD: jp_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      APP_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: mysql://jp:jp_ci_password@127.0.0.1:3306/jpservices
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations et données de démonstration
        run: |
          pnpm db:migrate
          SEED_DEMO=1 ADMIN_EMAIL=admin@jp-services.test ADMIN_PASSWORD=Admin-Demo-2026 pnpm db:seed
      - run: pnpm build
      - name: Navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
