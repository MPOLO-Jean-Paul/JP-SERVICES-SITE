name: CI — JP-Services Next.js

on:
  push:
    branches: [main, ccr-598b649d-2fiktj]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: PostgreSQL, lint, types, tests, build et Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jpservices
          POSTGRES_USER: jp
          POSTGRES_PASSWORD: jp_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jp -d jpservices"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      APP_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgres://jp:jp_ci_password@127.0.0.1:5432/jpservices
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Migrer la base PostgreSQL éphémère
        run: pnpm db:migrate
      - name: Tests unitaires
        run: pnpm test
      - name: Ajouter les données de test (CI seulement)
        run: pnpm db:seed
        env:
          SEED_DEMO: "1"
          ADMIN_EMAIL: admin@jp-services.test
          ADMIN_PASSWORD: Admin-Demo-2026
      - name: Compiler Next.js
        run: pnpm build
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests navigateur
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-ergonomie-frontend
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cloudflare:
    name: Vérification build Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
