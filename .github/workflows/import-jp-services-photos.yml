name: Ajouter les photographies originales au site
on:
  push:
    branches:
      - ccr-598b649d-2fiktj
    paths:
      - '.github/workflows/import-jp-services-photos.yml'
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install --quiet pillow
      - name: Télécharger, recadrer et optimiser les photos originales
        env:
          CANVA_SOURCE_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:133/quality:100/uri:ifs%3A%2F%2FM%2F4aa772a7-8872-4b24-871d-915c732b3035/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAFKutxK_eZl6jW7hhJ30KAdoj_su3llDQ7OVfVvMk-KJ&exp=1794824479&osig=AAAAAAAAAAAAAAAAAAAAAB4iPuqo0jGH4jA-W3M7hcs30d_c7WxqEeXXcyc5M9iB&signer=media-rpc&token=AAIAAU0AJDRhYTc3MmE3LTg4NzItNGIyNC04NzFkLTkxNWM3MzJiMzAzNQAAAAABoePgIRjxAsazciQvFSDgkLNBc5nOPTW23g-iyTyT4JzA9cUIQg&x-canva-quality=thumbnail"
        run: |
          python - <<'PY'
          import io, os, re, urllib.request
          from PIL import Image, ImageOps, ImageEnhance

          source=os.environ["CANVA_SOURCE_URL"]
          full=re.sub(r"height:\d+", "height:1024", source, count=1)
          full=re.sub(r"width:\d+", "width:1536", full, count=1)
          photos=None
          for label, url in (("original grand format",full),("aperçu de secours",source)):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      data=response.read(9_000_000)
                  image=Image.open(io.BytesIO(data)).convert("RGB")
                  image.load()
                  print("Téléchargé",label,image.size,len(data),"octets")
                  photos=image
                  break
              except Exception as exc:
                  print("Source non disponible",label,str(exc)[:280])
          if photos is None:
              raise RuntimeError("Impossible de récupérer la photographie générée")
          if photos.width<1100:
              print("Note : l'aperçu de secours a été agrandi (résolution du fichier source indisponible).")
              photos=photos.resize((1536,1024),Image.Resampling.LANCZOS)
          out="public/media"
          os.makedirs(out,exist_ok=True)
          crops=[
              ("atelier-numerique.webp",(0,0,1536,550),1180),
              ("developpement-logiciel.webp",(0,560,750,1024),780),
              ("travail-equipe.webp",(760,560,1536,1024),780),
          ]
          for filename,rect,width in crops:
              image=photos.crop(rect)
              image.thumbnail((width,1000),Image.Resampling.LANCZOS)
              image=ImageEnhance.Contrast(image).enhance(1.055)
              image.save(os.path.join(out,filename),"WEBP",quality=79,method=5)
              print("Photo enregistrée",filename,image.size)
          PY
      - name: Publier les photos dans la branche de prévisualisation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/*.webp
          git diff --cached --quiet || git commit -m "assets(site): images originales des trois activités principales"
          git push origin "HEAD:ccr-598b649d-2fiktj"
